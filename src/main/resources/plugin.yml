name: PvpBotDifficulty
version: 1.2.6
main: id.achxrzo.pvpbotdifficulty.PvpBotDifficulty
api-version: '1.21'
load: POSTWORLD
depend: [PvpBot]
author: OpenAI
description: Per-player PvP bot spawning, per-bot tiers, presets and kit GUI
commands:
  bott:
    description: Spawn and manage PvP bots
    usage: /bott <spawn|gui|tier|behavior|list|remove|tiers>
permissions:
  pvpbotdifficulty.spawn:
    description: Allow spawning PvP bots (2 active bots per player)
    default: true
  pvpbotdifficulty.admin:
    description: Admin management and kit editing; bypass player bot cap
    default: op
