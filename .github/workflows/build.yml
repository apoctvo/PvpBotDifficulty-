name: Build PvpBotDifficulty
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build against Paper 26.3 build 214
        run: mvn -U --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: PvpBotDifficulty-1.2.6
          path: target/*.jar
